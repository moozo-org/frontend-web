sonar.projectKey=moozo-org_frontend-web
sonar.organization=moozo-org

# Name and version displayed in the SonarQube Cloud UI
sonar.projectName=frontend-web
sonar.projectVersion=1.0

# Path is relative to this file
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Whole repo so the Dockerfile, compose files and workflows are checked, minus generated files
sonar.exclusions=**/node_modules/**,dist/**,package-lock.json

# shortcut: no coverage yet, the repo has no test runner. Add sonar.javascript.lcov.reportPaths once tests exist
