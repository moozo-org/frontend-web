sonar.projectKey=moozo-org_frontend-web
sonar.organization=moozo-org

# Name and version displayed in the SonarQube Cloud UI
sonar.projectName=frontend-web
sonar.projectVersion=1.0

# Path is relative to this file
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Whole repo so the Dockerfile, compose files and workflows are checked, minus generated files
sonar.exclusions=**/node_modules/**,dist/**,package-lock.json

# Locale files share the same keys by design
sonar.cpd.exclusions=src/i18n/locales/**

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage targets logic (utils, guards, providers). UI, route tables and wiring are left out
sonar.coverage.exclusions=src/pages/**,src/atoms/**,src/molecules/**,src/organisms/**,src/templates/**,src/layouts/**,src/routes/*.tsx,src/i18n/**,src/main.tsx,src/context/**,src/test/**,**/*.test.ts,**/*.test.tsx,**/*.config.ts,**/*.config.js
